name: Build Executables

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    name: Compile for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # We will build for all three major operating systems automatically!
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Ensure this matches your development version
        cache: 'pip'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk binutils

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller Build.spec

    - name: Upload Compiled Executable
      uses: actions/upload-artifact@v4
      with:
        name: PO-Importer-${{ runner.os }}
        path: |
          dist/PurchaseOrderImporter
          dist/PurchaseOrderImporter.exe
          dist/PurchaseOrderImporter.app
        # This ignores errors if a specific OS extension (like .exe) isn't found
        if-no-files-found: ignore
